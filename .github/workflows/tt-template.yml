name: tt template

on:
  workflow_call:
    inputs:
      topic:
        required: true
        type: string

jobs:
  tt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: shallow clone
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: build example
        run: |
          cd example
          go build

      - name: install tt
        run: go install github.com/tab-dance/tabdance-test/cmd/tt@latest

      - name: install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish osh # oil
          sudo snap install --classic powershell pwsh 2>/dev/null || true
          # elvish, nushell, xonsh available where pinned; missing shells are
          # skipped by tt because no golden is committed for them.
          go install golang.org/x/perf/cmd/... 2>/dev/null || true

      - name: run tape tests
        run: |
          cd docs/src/development/tt/${{ inputs.topic }}
          tt run . --jobs 8 --update

      - uses: actions/upload-artifact@v7
        with:
          name: tt-${{ inputs.topic }}
          path: |
            docs/src/development/tt/${{ inputs.topic }}/
            !docs/src/development/tt/${{ inputs.topic }}/*.tape
          retention-days: 1

      - name: check
        run: |
          git diff
          [ -z "$(git status --porcelain)" ] # clean workspace unless .golden files changed
