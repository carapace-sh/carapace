[book]
authors = ["rsteube"]
language = "en"
src = "src"
title = "carapace"
description = "A multi-shell completion library."

[output.html]
default-theme = "Latte"
preferred-dark-theme = "Mocha"
additional-css = ["./theme/catppuccin.css"]
git-repository-url = "https://github.com/carapace-sh/carapace"
edit-url-template = "https://github.com/carapace-sh/carapace/edit/master/docs/{path}"

[output.html.fold]
enable = true

[output.linkcheck2]
follow-web-links = true
exclude = [ 'gnu\.org', '\./.+/out/.+\.gif', 'go\.dev', 'microsoft\.com', 'iridakos\.com']

[preprocessor.asciinema]
